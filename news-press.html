<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>常用消毒殺菌產品介紹 - 愛思帝長效清潔劑</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* news grid: 一排 4 個，響應式變為 2/1 */
    .news-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-top:18px; }
    .news-item { background:#fff; border:1px solid #e6e6e6; padding:12px; text-align:center; }
    .news-item img { width:100%; height:250px; object-fit:cover; display:block;}
    .news-item h3 { font-size:16px; color:#1f497d; margin:12px 0 8px 0; }
    .news-item p { color:#333; font-size:14px; }
    @media (max-width:900px){ .news-grid { grid-template-columns:repeat(2,1fr); } .news-item img{ height:140px; } }
    @media (max-width:480px){ .news-grid { grid-template-columns:1fr; } .news-item img{ height:200px; } }
  </style>
</head>
<body>
  <div id="site-header-placeholder"></div>

  <section class="product-banner-center">
      <img src="images/news-press-banner.jpg" alt="常用消毒殺菌產品介紹 橫幅" width="1300" height="325">
  </section>

  <main class="container">
    <section style="margin-top:8px;">
      <h1>常用消毒殺菌產品介紹</h1>

      <div class="news-grid" aria-label="常用消毒殺菌產品列表">
        <article class="news-item">
          <img src="images/news-common.svg" alt="台大醫示警 7族群"/>
          <h3>台大醫示警「7族群染流感」恐致命</h3>
          <p>門把、電梯按鈕皆是傳染途徑，提醒重點預防措施與清潔要點。</p>
        </article>

        <article class="news-item">
          <img src="images/news-common.svg" alt="防疫預防及清潔注意事項"/>
          <h3>防疫預防及清潔注意事項</h3>
          <p>整理日常預防程序與環境清潔重點，降低感染風險的實用建議。</p>
        </article>

        <article class="news-item">
          <img src="images/news-common.svg" alt="7種消毒劑懶人包"/>
          <h3>不只酒精！「7種消毒劑」懶人包</h3>
          <p>列出適用物品、注意事項與使用建議，幫你快速選擇合適消毒劑。</p>
        </article>

        <article class="news-item">
          <img src="images/news-common.svg" alt="次氯酸水等正確用法"/>
          <h3>次氯酸水/酒精/漂白水 正確用法</h3>
          <p>說明各類消毒劑的功效與正確使用方式，確保消毒安全與效果。</p>
        </article>
      </div>

    </section>
  </main>

  <div id="site-footer-placeholder"></div>

  <script src="js/title.js"></script>
  <script src="js/footer.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
