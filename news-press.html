  <link rel="stylesheet" href="css/style.css">
  <style>
    /* news grid: 一排 4 個，響應式變為 2/1 */
    .news-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-top:18px; }
    .news-item { background:#fff; border:1px solid #e6e6e6; padding:12px; text-align:center; }
    .news-item img { width:100%; height:250px; object-fit:cover; display:block;}
    .news-item h3 { font-size:16px; color:#1f497d; margin:12px 0 8px 0; }
    .news-item p { color:#333; font-size:14px; }
    @media (max-width:900px){ .news-grid { grid-template-columns:repeat(2,1fr); } .news-item img{ height:140px; } }
    @media (max-width:480px){ .news-grid { grid-template-columns:1fr; } .news-item img{ height:200px; } }
  </style>
</head>
